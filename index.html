<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools.online - ศูนย์รวมเครื่องมือคำนวณออนไลน์ฟรี ใช้งานง่าย โหลดไว</title>
  <meta name="description" content="รวมเครื่องมือคำนวณออนไลน์ฟรี แปลงหน่วยที่ดิน คำนวณ BTU แอร์ คำนวณค่างวดผ่อนบ้านรถ คิด VAT 7% นับคำ และสร้าง QR Code ใช้งานฟรี 100%">
  <link rel="canonical" href="https://tools.online/">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <!-- HEADER -->
  <header id="site-header" class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800"></header>

  <!-- HERO & CATEGORY FILTER -->
  <section class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800 pt-8 pb-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white">เพื่อนคู่คิดเรื่องเครื่องมือคำนวณและมินิแอป ใช้ง่าย ฟรี ไม่มีสะดุด!</h1>
      <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">เลือกเครื่องมือที่ต้องการใช้งาน แยกหน้าชัดเจน โหลดไว ประมวลผลบนเบราว์เซอร์ 100%</p>

      <div class="flex items-center justify-start sm:justify-center gap-2 overflow-x-auto pb-2 mt-6">
        <button onclick="filterCategory('all')" data-cat="all" class="cat-btn active px-4 py-2 text-sm font-medium rounded-full bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 flex items-center gap-2 whitespace-nowrap"><i data-lucide="layout-grid" class="w-4 h-4 text-amber-400"></i> ทั้งหมด</button>
        <button onclick="filterCategory('real-estate')" data-cat="real-estate" class="cat-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-2 whitespace-nowrap"><i data-lucide="home" class="w-4 h-4 text-emerald-500"></i> อสังหาฯ & งานช่าง</button>
        <button onclick="filterCategory('finance')" data-cat="finance" class="cat-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-2 whitespace-nowrap"><i data-lucide="calculator" class="w-4 h-4 text-blue-500"></i> การเงิน & ชีวิตประจำวัน</button>
        <button onclick="filterCategory('text')" data-cat="text" class="cat-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-2 whitespace-nowrap"><i data-lucide="file-text" class="w-4 h-4 text-purple-500"></i> ข้อความ & คอนเทนต์</button>
        <button onclick="filterCategory('media')" data-cat="media" class="cat-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-2 whitespace-nowrap"><i data-lucide="image" class="w-4 h-4 text-rose-500"></i> ปรับภาพ & สื่อ</button>
      </div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 p-2"><!-- พื้นที่โฆษณา --></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="tools-cards-container"></div>
      </div>

      <!-- SIDEBAR -->
      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1.5 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="h-64 rounded-2xl flex items-center justify-center"><!-- พื้นที่โฆษณา --></div>
      </aside>
    </div>
  </main>

  <!-- FOOTER -->
  <footer id="site-footer" class="mt-auto bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6"></footer>

  <script src="assets/app.js"></script>
</body>
</html>
