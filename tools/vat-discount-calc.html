<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณ VAT 7% และส่วนลด - Tools.online</title>
  <meta name="description" content="คำนวณ VAT 7% แบบบวกเพิ่ม ถอด VAT ออกจากราคารวม คิดส่วนลดเปอร์เซ็นต์ และส่วนลดซ้อน">
  <link rel="canonical" href="https://tools.online/tools/vat-discount-calc.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/vat-discount-guide.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">อ่านคู่มือ VAT & ส่วนลด</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">คำนวณ VAT 7% และส่วนลด</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">คำนวณส่วนลดขั้นแรก ส่วนลดซ้อน และ VAT 7% ได้ในหน้าเดียว</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium mb-1">ราคาตั้งต้น (บาท)</label>
              <input id="vd-price" type="number" min="0" step="any" value="1000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ส่วนลดแรก (%)</label>
              <input id="vd-disc1" type="number" min="0" max="100" step="any" value="20" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ส่วนลดซ้อน (%)</label>
              <input id="vd-disc2" type="number" min="0" max="100" step="any" value="10" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-4 text-xs">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="radio" name="vd-mode" value="add" checked class="text-brand-600">
              <span>บวก VAT 7% เพิ่มหลังหักส่วนลด</span>
            </label>
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="radio" name="vd-mode" value="remove" class="text-brand-600">
              <span>ถอด VAT 7% ออกจากยอดหลังหักส่วนลด</span>
            </label>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-xs text-slate-500 dark:text-slate-400">ยอดหลังหักส่วนลด (ก่อน VAT)</div>
              <div id="vd-after-disc" class="text-lg font-bold text-slate-900 dark:text-white mt-1">720.00 บาท</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-xs text-slate-500 dark:text-slate-400">มูลค่า VAT 7%</div>
              <div id="vd-vat-amt" class="text-lg font-bold text-slate-900 dark:text-white mt-1">50.40 บาท</div>
            </div>
            <div class="p-4 rounded-xl bg-brand-50 dark:bg-sky-950/40 border border-brand-100 dark:border-sky-900">
              <div class="text-xs text-slate-500 dark:text-slate-400">ยอดสุทธิ</div>
              <div id="vd-final" class="text-xl font-bold text-brand-700 dark:text-sky-300 mt-1">770.40 บาท</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    function fmtBath(n) {
      return `${n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท`;
    }
    function calcVatDiscount() {
      const price = Math.max(0, parseFloat(document.getElementById('vd-price').value) || 0);
      const d1 = Math.min(100, Math.max(0, parseFloat(document.getElementById('vd-disc1').value) || 0));
      const d2 = Math.min(100, Math.max(0, parseFloat(document.getElementById('vd-disc2').value) || 0));
      const mode = document.querySelector('input[name="vd-mode"]:checked').value;

      const netAfterDisc = price * (1 - d1 / 100) * (1 - d2 / 100);
      let preVat = netAfterDisc;
      let vat = 0;
      let total = netAfterDisc;

      if (mode === 'add') {
        preVat = netAfterDisc;
        vat = preVat * 0.07;
        total = preVat + vat;
      } else {
        preVat = netAfterDisc / 1.07;
        vat = netAfterDisc - preVat;
        total = netAfterDisc;
      }

      document.getElementById('vd-after-disc').textContent = fmtBath(preVat);
      document.getElementById('vd-vat-amt').textContent = fmtBath(vat);
      document.getElementById('vd-final').textContent = fmtBath(total);
    }

    ['vd-price', 'vd-disc1', 'vd-disc2'].forEach(id => document.getElementById(id).addEventListener('input', calcVatDiscount));
    document.querySelectorAll('input[name="vd-mode"]').forEach(r => r.addEventListener('change', calcVatDiscount));
    calcVatDiscount();
  </script>
</body>
</html>
