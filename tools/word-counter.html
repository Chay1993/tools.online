<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>นับคำ นับตัวอักษร และเวลาอ่าน - Tools.online</title>
  <meta name="description" content="นับจำนวนคำ จำนวนตัวอักษร เว้นวรรคและไม่เว้นวรรค บรรทัด และเวลาอ่านโดยประมาณ">
  <link rel="canonical" href="https://tools.online/tools/word-counter.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/index.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">คู่มือ & บทความ</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">นับคำ นับตัวอักษร และเวลาอ่าน</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">พิมพ์หรือวางข้อความเพื่อตรวจสอบจำนวนคำ ตัวอักษร และเวลาอ่านโดยประมาณ</p>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="p-3.5 rounded-xl bg-brand-50 dark:bg-sky-950/40 border border-brand-100 dark:border-sky-900">
              <div class="text-[11px] text-slate-500 dark:text-slate-400">จำนวนคำ</div>
              <div id="wc-words" class="text-xl font-bold text-brand-700 dark:text-sky-300 mt-0.5">0</div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-[11px] text-slate-500 dark:text-slate-400">อักขระ (รวมวรรค)</div>
              <div id="wc-chars" class="text-xl font-bold text-slate-900 dark:text-white mt-0.5">0</div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-[11px] text-slate-500 dark:text-slate-400">อักขระ (ไม่รวมวรรค)</div>
              <div id="wc-nospace" class="text-xl font-bold text-slate-900 dark:text-white mt-0.5">0</div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-[11px] text-slate-500 dark:text-slate-400">เวลาอ่านโดยประมาณ</div>
              <div id="wc-readtime" class="text-xl font-bold text-slate-900 dark:text-white mt-0.5">< 1 นาที</div>
            </div>
          </div>

          <textarea id="wc-text" rows="8" placeholder="วางหรือพิมพ์ข้อความที่นี่..." class="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    const wcText = document.getElementById('wc-text');
    function updateCounts() {
      const val = wcText.value;
      const chars = val.length;
      const noSpace = val.replace(/\s+/g, '').length;
      const words = val.trim() ? val.trim().split(/\s+/).length : 0;
      const mins = Math.ceil(noSpace / 450);

      document.getElementById('wc-words').textContent = words.toLocaleString('th-TH');
      document.getElementById('wc-chars').textContent = chars.toLocaleString('th-TH');
      document.getElementById('wc-nospace').textContent = noSpace.toLocaleString('th-TH');
      document.getElementById('wc-readtime').textContent = noSpace === 0 ? '< 1 นาที' : `${Math.max(1, mins)} นาที`;
    }
    wcText.addEventListener('input', updateCounts);
    updateCounts();
  </script>
</body>
</html>
