<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณกระเบื้อง & ปูนก่อ/ฉาบ - Tools.online</title>
  <meta name="description" content="คำนวณจำนวนแผ่นกระเบื้องเผื่อตัดเสีย และปริมาณปูนเบื้องต้นสำหรับงานก่อและฉาบ">
  <link rel="canonical" href="https://tools.online/tools/tile-cement-calc.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/index.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">คู่มือ & บทความ</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">คำนวณกระเบื้อง & ปูนก่อ/ฉาบ</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">กะจำนวนกระเบื้องและปริมาณปูนเบื้องต้นเพื่อวางแผนซื้อวัสดุ</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium mb-1">พื้นที่หน้างาน (ตร.ม.)</label>
              <input id="tile-area" type="number" min="0.1" step="0.1" value="24" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ขนาดกระเบื้อง (ซม.)</label>
              <select id="tile-size" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                <option value="0.09">30 × 30 ซม.</option>
                <option value="0.16">40 × 40 ซม.</option>
                <option value="0.36" selected>60 × 60 ซม.</option>
                <option value="0.64">80 × 80 ซม.</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">เผื่อตัดเสีย (%)</label>
              <input id="tile-waste" type="number" min="0" max="50" step="1" value="10" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl bg-brand-50 dark:bg-sky-950/40 border border-brand-100 dark:border-sky-900">
              <div class="text-xs text-slate-500 dark:text-slate-400">จำนวนกระเบื้องที่ควรเตรียม</div>
              <div id="tile-count-out" class="text-2xl font-bold text-brand-700 dark:text-sky-300 mt-1">74 แผ่น</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-xs text-slate-500 dark:text-slate-400">ประมาณการปูนฉาบ (ถุง 50 กก. หนา ~1.5 ซม.)</div>
              <div id="cement-bags-out" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">~3 ถุง</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    function calcTileCement() {
      const area = Math.max(0.1, parseFloat(document.getElementById('tile-area').value) || 0);
      const tileSqm = parseFloat(document.getElementById('tile-size').value) || 0.36;
      const waste = Math.max(0, parseFloat(document.getElementById('tile-waste').value) || 0);
      const sheets = Math.ceil((area / tileSqm) * (1 + waste / 100));
      const bags = Math.max(1, Math.ceil((area * 0.015) / 0.14));
      document.getElementById('tile-count-out').textContent = `${sheets.toLocaleString('th-TH')} แผ่น`;
      document.getElementById('cement-bags-out').textContent = `~${bags.toLocaleString('th-TH')} ถุง`;
    }
    ['tile-area', 'tile-size', 'tile-waste'].forEach(id => {
      document.getElementById(id).addEventListener('input', calcTileCement);
      document.getElementById(id).addEventListener('change', calcTileCement);
    });
    calcTileCement();
  </script>
</body>
</html>
