<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณ BTU แอร์ตามขนาดห้อง - Tools.online</title>
  <meta name="description" content="คำนวณ BTU เครื่องปรับอากาศเบื้องต้นจากขนาดห้อง กว้าง ยาว สูง ทิศทางแดด และจำนวนคน">
  <link rel="canonical" href="https://tools.online/tools/btu-calc.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/btu-calculation-guide.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">อ่านคู่มือคำนวณ BTU</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">คำนวณ BTU แอร์ตามขนาดห้อง</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">ประเมินค่า BTU เบื้องต้นเพื่อเลือกขนาดแอร์ให้เหมาะสมกับการใช้งาน</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium mb-1">ความกว้างห้อง (เมตร)</label>
              <input id="btu-w" type="number" min="1" step="0.1" value="4" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ความยาวห้อง (เมตร)</label>
              <input id="btu-l" type="number" min="1" step="0.1" value="5" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">จำนวนคนในห้อง</label>
              <input id="btu-people" type="number" min="1" step="1" value="2" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium mb-1">ลักษณะห้อง / แดด</label>
              <select id="btu-sun" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                <option value="750">ห้องนอน / ไม่โดนแดดจัด (ตัวคูณ ~750)</option>
                <option value="850" selected>ห้องทั่วไป / แดดปานกลาง (ตัวคูณ ~850)</option>
                <option value="950">ห้องรับแขก / โดนแดดบ่ายหรือฝ้าติดหลังคา (ตัวคูณ ~950)</option>
              </select>
            </div>
            <div class="flex items-end">
              <button type="button" onclick="calcBtu()" class="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition-colors">คำนวณ BTU</button>
            </div>
          </div>

          <div class="p-4 rounded-xl bg-brand-50 dark:bg-sky-950/40 border border-brand-100 dark:border-sky-900 space-y-1">
            <div class="text-xs text-slate-500 dark:text-slate-400">BTU ที่แนะนำโดยประมาณ</div>
            <div id="btu-result" class="text-2xl font-bold text-brand-700 dark:text-sky-300">18,800 BTU/hr</div>
            <div id="btu-area-note" class="text-xs text-slate-600 dark:text-slate-300">พื้นที่ 20.0 ตร.ม.</div>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    function calcBtu() {
      const w = Math.max(0.5, parseFloat(document.getElementById('btu-w').value) || 0);
      const l = Math.max(0.5, parseFloat(document.getElementById('btu-l').value) || 0);
      const people = Math.max(1, parseInt(document.getElementById('btu-people').value, 10) || 1);
      const factor = parseFloat(document.getElementById('btu-sun').value) || 850;
      const area = w * l;
      const extraPeople = Math.max(0, people - 1) * 900;
      const totalBtu = Math.round((area * factor + extraPeople) / 100) * 100;
      document.getElementById('btu-result').textContent = `${totalBtu.toLocaleString('th-TH')} BTU/hr`;
      document.getElementById('btu-area-note').textContent = `พื้นที่ ${area.toFixed(1)} ตร.ม. | ผู้ใช้งาน ${people} คน`;
    }
    ['btu-w', 'btu-l', 'btu-people', 'btu-sun'].forEach(id => {
      document.getElementById(id).addEventListener('input', calcBtu);
      document.getElementById(id).addEventListener('change', calcBtu);
    });
    calcBtu();
  </script>
</body>
</html>
