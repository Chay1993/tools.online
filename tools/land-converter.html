<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แปลงหน่วยที่ดิน (ไร่-งาน-วา / ตร.ม.) - Tools.online</title>
  <meta name="description" content="แปลงหน่วยที่ดินไทย ไร่ งาน ตารางวา เป็นตารางเมตร และแปลงตารางเมตรกลับเป็นไร่-งาน-ตารางวา แบบรวดเร็ว">
  <link rel="canonical" href="https://tools.online/tools/land-converter.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/land-measurement-guide.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">อ่านคู่มือแปลงหน่วยที่ดิน</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">แปลงหน่วยที่ดิน (ไร่-งาน-วา / ตร.ม.)</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">1 ไร่ = 4 งาน = 400 ตารางวา = 1,600 ตารางเมตร (1 ตารางวา = 4 ตารางเมตร)</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium mb-1">ไร่</label>
              <input id="land-rai" type="number" min="0" step="any" value="1" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">งาน</label>
              <input id="land-ngan" type="number" min="0" step="any" value="0" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ตารางวา</label>
              <input id="land-wa" type="number" min="0" step="any" value="0" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
          </div>

          <div class="p-4 rounded-xl bg-brand-50 dark:bg-sky-950/40 border border-brand-100 dark:border-sky-900 space-y-1">
            <div class="text-xs text-slate-500 dark:text-slate-400">พื้นที่รวมเป็นตารางเมตร</div>
            <div id="land-sqm-result" class="text-2xl font-bold text-brand-700 dark:text-sky-300">1,600.00 ตร.ม.</div>
            <div id="land-total-wa-result" class="text-xs text-slate-600 dark:text-slate-300">รวม 400.00 ตารางวา</div>
          </div>

          <div class="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-3">
            <label for="land-sqm-input" class="block text-xs font-medium">แปลงจากตารางเมตร (ตร.ม.) เป็น ไร่-งาน-ตารางวา</label>
            <input id="land-sqm-input" type="number" min="0" step="any" value="1600" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            <div id="land-thai-result" class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 text-sm font-semibold text-slate-900 dark:text-white">
              1 ไร่ 0 งาน 0.00 ตารางวา
            </div>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    const raiEl = document.getElementById('land-rai');
    const nganEl = document.getElementById('land-ngan');
    const waEl = document.getElementById('land-wa');
    const sqmInput = document.getElementById('land-sqm-input');

    function calcFromThai() {
      const rai = Math.max(0, parseFloat(raiEl.value) || 0);
      const ngan = Math.max(0, parseFloat(nganEl.value) || 0);
      const wa = Math.max(0, parseFloat(waEl.value) || 0);
      const totalWa = rai * 400 + ngan * 100 + wa;
      const totalSqm = totalWa * 4;
      document.getElementById('land-sqm-result').textContent = `${totalSqm.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ตร.ม.`;
      document.getElementById('land-total-wa-result').textContent = `รวม ${totalWa.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ตารางวา`;
    }

    function calcFromSqm() {
      const sqm = Math.max(0, parseFloat(sqmInput.value) || 0);
      let remWa = sqm / 4;
      const rai = Math.floor(remWa / 400);
      remWa -= rai * 400;
      const ngan = Math.floor(remWa / 100);
      remWa -= ngan * 100;
      document.getElementById('land-thai-result').textContent = `${rai.toLocaleString('th-TH')} ไร่ ${ngan.toLocaleString('th-TH')} งาน ${remWa.toFixed(2)} ตารางวา`;
    }

    [raiEl, nganEl, waEl].forEach(el => el.addEventListener('input', calcFromThai));
    sqmInput.addEventListener('input', calcFromSqm);
    calcFromThai();
    calcFromSqm();
  </script>
</body>
</html>
