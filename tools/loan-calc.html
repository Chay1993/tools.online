<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณค่างวดผ่อนบ้านและรถ - Tools.online</title>
  <meta name="description" content="คำนวณค่างวดผ่อนบ้านและรถ ประเมินยอดผ่อนต่อเดือนและดอกเบี้ยรวมเบื้องต้น">
  <link rel="canonical" href="https://tools.online/tools/loan-calc.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/loan-calculation-guide.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">อ่านคู่มือคำนวณค่างวด</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">คำนวณค่างวดผ่อนบ้านและรถ</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">จำลองค่างวดรายเดือนและดอกเบี้ยโดยประมาณ</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium mb-1">ประเภทการคิดดอกเบี้ย</label>
              <select id="loan-type" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                <option value="effective">ลดต้นลดดอก (สินเชื่อบ้าน)</option>
                <option value="flat">ดอกเบี้ยคงที่ Flat Rate (สินเชื่อรถ)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ยอดเงินกู้ / ยอดจัด (บาท)</label>
              <input id="loan-amount" type="number" min="1000" step="1000" value="1000000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ดอกเบี้ยต่อปี (%)</label>
              <input id="loan-rate" type="number" min="0" step="0.05" value="4.0" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">ระยะเวลาผ่อน (ปี)</label>
              <input id="loan-years" type="number" min="1" max="40" step="1" value="20" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl bg-brand-50 dark:bg-sky-950/40 border border-brand-100 dark:border-sky-900">
              <div class="text-xs text-slate-500 dark:text-slate-400">ค่างวดต่อเดือนโดยประมาณ</div>
              <div id="loan-monthly" class="text-2xl font-bold text-brand-700 dark:text-sky-300 mt-1">6,060 บาท</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <div class="text-xs text-slate-500 dark:text-slate-400">ดอกเบี้ยรวมตลอดสัญญา</div>
              <div id="loan-total-int" class="text-xl font-bold text-slate-900 dark:text-white mt-1">454,316 บาท</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    function calcLoan() {
      const type = document.getElementById('loan-type').value;
      const principal = Math.max(0, parseFloat(document.getElementById('loan-amount').value) || 0);
      const annualRate = Math.max(0, parseFloat(document.getElementById('loan-rate').value) || 0);
      const years = Math.max(1, parseInt(document.getElementById('loan-years').value, 10) || 1);
      const months = years * 12;

      let monthly = 0;
      let totalInterest = 0;

      if (type === 'flat') {
        totalInterest = principal * (annualRate / 100) * years;
        monthly = (principal + totalInterest) / months;
      } else {
        const r = annualRate / 100 / 12;
        if (r === 0) {
          monthly = principal / months;
          totalInterest = 0;
        } else {
          monthly = (principal * r) / (1 - Math.pow(1 + r, -months));
          totalInterest = monthly * months - principal;
        }
      }

      document.getElementById('loan-monthly').textContent = `${Math.round(monthly).toLocaleString('th-TH')} บาท`;
      document.getElementById('loan-total-int').textContent = `${Math.round(totalInterest).toLocaleString('th-TH')} บาท`;
    }

    ['loan-type', 'loan-amount', 'loan-rate', 'loan-years'].forEach(id => {
      document.getElementById(id).addEventListener('input', calcLoan);
      document.getElementById(id).addEventListener('change', calcLoan);
    });
    calcLoan();
  </script>
</body>
</html>
