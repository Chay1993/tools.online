<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สุ่มรหัสผ่านปลอดภัย (Password Generator) - Tools.online</title>
  <meta name="description" content="สร้างรหัสผ่านแบบสุ่มที่ปลอดภัย เลือกความยาวและชนิดตัวอักษรได้ตามต้องการ">
  <link rel="canonical" href="https://tools.online/tools/password-generator.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' } } } } };
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  </script>
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <header id="site-header" class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
      <a href="../index.html" class="font-medium text-slate-600 dark:text-slate-300 hover:text-brand-600 flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแรก
      </a>
      <a href="../guides/index.html" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">คู่มือ & บทความ</a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <section class="lg:col-span-8 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">สุ่มรหัสผ่านปลอดภัย (Password Generator)</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">สุ่มรหัสผ่านในเบราว์เซอร์ของคุณเอง ไม่มีการส่งข้อมูลออกไปภายนอก</p>
          </div>

          <div class="flex items-center gap-2">
            <input id="pw-output" type="text" readonly class="flex-grow px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-sm">
            <button type="button" onclick="copyPassword()" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold">คัดลอก</button>
            <button type="button" onclick="generatePassword()" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold">สุ่มใหม่</button>
          </div>

          <div class="space-y-3 pt-1">
            <div class="flex items-center justify-between text-xs">
              <label for="pw-length" class="font-medium">ความยาวรหัสผ่าน</label>
              <span id="pw-length-val" class="font-bold text-brand-600 dark:text-brand-400">16 ตัวอักษร</span>
            </div>
            <input id="pw-length" type="range" min="8" max="64" value="16" class="w-full accent-brand-600">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input id="pw-upper" type="checkbox" checked class="rounded text-brand-600">
              <span>ตัวพิมพ์ใหญ่ (A-Z)</span>
            </label>
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input id="pw-lower" type="checkbox" checked class="rounded text-brand-600">
              <span>ตัวพิมพ์เล็ก (a-z)</span>
            </label>
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input id="pw-num" type="checkbox" checked class="rounded text-brand-600">
              <span>ตัวเลข (0-9)</span>
            </label>
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input id="pw-sym" type="checkbox" checked class="rounded text-brand-600">
              <span>สัญลักษณ์พิเศษ (!@#$...)</span>
            </label>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-4 space-y-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> เครื่องมือยอดนิยม</h2>
          <ul class="space-y-1 text-sm" id="popular-tools-list"></ul>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-500"></i> บทความล่าสุด</h2>
            <a href="../guides/index.html" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ดูทั้งหมด</a>
          </div>
          <ul class="space-y-1 text-sm" id="latest-guides-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-auto"></footer>

  <script src="../assets/app.js"></script>
  <script>
    function generatePassword() {
      const len = parseInt(document.getElementById('pw-length').value, 10) || 16;
      document.getElementById('pw-length-val').textContent = `${len} ตัวอักษร`;

      let pool = '';
      if (document.getElementById('pw-upper').checked) pool += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('pw-lower').checked) pool += 'abcdefghijklmnopqrstuvwxyz';
      if (document.getElementById('pw-num').checked) pool += '0123456789';
      if (document.getElementById('pw-sym').checked) pool += '!@#$%^&*()-_=+[]{}';
      if (!pool) pool = 'abcdefghijklmnopqrstuvwxyz0123456789';

      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let out = '';
      for (let i = 0; i < len; i++) {
        out += pool[arr[i] % pool.length];
      }
      document.getElementById('pw-output').value = out;
    }

    function copyPassword() {
      const el = document.getElementById('pw-output');
      if (!el.value) return;
      navigator.clipboard?.writeText(el.value).catch(() => {});
    }

    ['pw-length', 'pw-upper', 'pw-lower', 'pw-num', 'pw-sym'].forEach(id => {
      document.getElementById(id).addEventListener('input', generatePassword);
      document.getElementById(id).addEventListener('change', generatePassword);
    });
    generatePassword();
  </script>
</body>
</html>
