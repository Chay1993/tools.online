  <script>
    function calcWordCount() {
      const text = document.getElementById('wc-input').value;
      document.getElementById('wc-chars').innerText = text.length.toLocaleString();
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('wc-words').innerText = words.toLocaleString();
      const lines = text ? text.split(/\r\n|\r|\n/).length : 0;
      document.getElementById('wc-lines').innerText = lines.toLocaleString();
    }
