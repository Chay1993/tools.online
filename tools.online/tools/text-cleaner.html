  <script src="../assets/app.js"></script>
  <script>
    function cleanText(type) {
      const el = document.getElementById('tc-input');
      if (type === 'spaces') el.value = el.value.replace(/[ \t]+/g, ' ').trim();
      if (type === 'lines') el.value = el.value.replace(/^\s*[\r\n]/gm, '');
      if (type === 'special') el.value = el.value.replace(/[^\w\s\u0E00-\u0E7F]/g, '');
    }
    function copyElementText(id) {
      const el = document.getElementById(id);
      el.select(); navigator.clipboard.writeText(el.value);
      alert('คัดลอกข้อความเรียบร้อยแล้ว!');
    }
  </script>
